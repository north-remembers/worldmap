<!DOCTYPE html>
<head>
    <title>World Map</title>
    <style>
        body {
            background-color: lightblue;
        }
        h1 {
            color: darkblue;
        }

        p {
            color: darkgreen;
        }
    </style>
</head>

<body>

    <h1>World Map</h1>

    <p>Click on a continent to explore it</p>

    <img src="World.jpg"
         alt="World Map"
         usemap="#worldmap">

    <map name="worldmap">

        <area shape="rect"
              coords="471,24,628,148"
              href="asia.html"
              alt="Asia">

        <area shape="rect"
              coords="348,23,460,92"
              href="europe.html"
              alt="Europe">

        <area shape="rect"
              coords="331,105,475,260"
              href="africa.html"
              alt="Africa">

        <area shape="rect"
              coords="118,27,246,142"
              href="North.html"
              alt="North America">

    </map>

</body>
</html>
